# Installed by deploy/setup-server.sh, which replaces __DOMAIN__ with the real hostname.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Let's Encrypt renewals prove control of the domain here
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Matches DATA_UPLOAD_MAX_MEMORY_SIZE in settings
    client_max_body_size 50m;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Uploaded files (media/) are only read by the worker, so nginx doesn't serve them

    location /static/ {
        alias /srv/fastext/staticfiles/;
        # Pages link to hashed filenames, so a new deploy never reuses a cached one
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://unix:/run/fastext/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
