<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GottaWordFast{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/reader.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <script>
        // Apply saved theme before paint to prevent flash
        (function() {
            var t = localStorage.getItem('gwf_theme') || 'default';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>
    {% block body %}{% endblock %}
    <script src="{% static 'js/api.js' %}"></script>
    <script>
        // Escape API data before interpolating it into innerHTML — available on all pages
        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // Theme switcher logic — available on all pages
        const gwfTheme = {
            themes: ['default', 'warm', 'midnight', 'forest', 'mono'],
            labels: { default: 'Ocean', warm: 'Warm', midnight: 'Midnight', forest: 'Forest', mono: 'Mono' },
            colors: {
                default:  { background_color: '#1a1a2e', text_color: '#e0e0e0', ui_color: '#0f3460' },
                warm:     { background_color: '#1c1712', text_color: '#e8dcc8', ui_color: '#8b6b3d' },
                midnight: { background_color: '#13111c', text_color: '#d4d0e8', ui_color: '#5a4dbf' },
                forest:   { background_color: '#0f1a14', text_color: '#d4e4d8', ui_color: '#2d7a4f' },
                mono:     { background_color: '#141414', text_color: '#e0e0e0', ui_color: '#3580bb' },
            },
            current() { return localStorage.getItem('gwf_theme') || 'default'; },
            set(name) {
                localStorage.setItem('gwf_theme', name);
                document.documentElement.setAttribute('data-theme', name);
                document.querySelectorAll('.theme-swatch').forEach(s => {
                    s.classList.toggle('active', s.dataset.theme === name);
                });
                if (this.colors[name] && typeof api !== 'undefined' && api.isAuthenticated()) {
                    api.patch('/api/auth/preferences/', this.colors[name]).catch(() => {});
                }
            },
            render(container) {
                const current = this.current();
                this.themes.forEach(name => {
                    const swatch = document.createElement('button');
                    swatch.className = 'theme-swatch' + (name === current ? ' active' : '');
                    swatch.dataset.theme = name;
                    swatch.title = this.labels[name];
                    swatch.addEventListener('click', () => this.set(name));
                    container.appendChild(swatch);
                });
            }
        };
    </script>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
