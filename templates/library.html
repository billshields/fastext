{% extends "base.html" %}
{% block title %}SpeedReader - Library{% endblock %}

{% block body %}
<div class="library-container">
    <header class="library-header">
        <h1>My Library</h1>
        <div class="header-actions">
            <button id="btn-upload" class="btn btn-primary">Upload Book</button>
            <button id="btn-logout" class="btn btn-secondary">Logout</button>
        </div>
    </header>

    <input type="file" id="file-input" accept=".pdf,.epub" hidden>

    <div id="upload-status" class="upload-status" hidden>
        <span id="upload-msg">Uploading...</span>
    </div>

    <div class="library-toolbar">
        <input type="text" id="search-input" class="toolbar-input" placeholder="Search by title...">
        <select id="sort-select" class="toolbar-select">
            <option value="uploaded_newest">Newest first</option>
            <option value="uploaded_oldest">Oldest first</option>
            <option value="title_asc">Title A-Z</option>
            <option value="title_desc">Title Z-A</option>
            <option value="last_read">Last read</option>
            <option value="progress_desc">Most progress</option>
            <option value="progress_asc">Least progress</option>
        </select>
        <select id="status-select" class="toolbar-select">
            <option value="">All statuses</option>
            <option value="completed">Completed</option>
            <option value="processing">Processing</option>
            <option value="pending">Pending</option>
            <option value="failed">Failed</option>
        </select>
    </div>

    <div id="documents-list" class="documents-grid">
        <p class="loading-msg">Loading your library...</p>
    </div>

    <div id="empty-state" class="empty-state" hidden>
        <p>No books yet. Upload a PDF or EPUB to get started.</p>
    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
    if (!api.isAuthenticated()) {
        window.location.href = '/';
    }

    const docsList = document.getElementById('documents-list');
    const emptyState = document.getElementById('empty-state');
    const uploadStatus = document.getElementById('upload-status');
    const uploadMsg = document.getElementById('upload-msg');

    const searchInput = document.getElementById('search-input');
    const sortSelect = document.getElementById('sort-select');
    const statusSelect = document.getElementById('status-select');

    function hasActiveFilters() {
        return searchInput.value.trim() !== '' || statusSelect.value !== '';
    }

    async function loadDocuments() {
        try {
            const params = new URLSearchParams();
            if (searchInput.value.trim()) params.set('search', searchInput.value.trim());
            if (sortSelect.value) params.set('sort', sortSelect.value);
            if (statusSelect.value) params.set('status', statusSelect.value);
            const qs = params.toString();
            const url = '/api/documents/' + (qs ? '?' + qs : '');
            const data = await api.get(url);
            docsList.innerHTML = '';

            if (data.length === 0) {
                emptyState.hidden = false;
                emptyState.querySelector('p').textContent = hasActiveFilters()
                    ? 'No documents match your search or filters.'
                    : 'No books yet. Upload a PDF or EPUB to get started.';
                return;
            }
            emptyState.hidden = true;

            for (const doc of data) {
                const card = document.createElement('div');
                card.className = 'doc-card';

                const progress = doc.total_words > 0
                    ? Math.round(((doc.current_position || 0) / doc.total_words) * 100)
                    : null;
                const statusBadge = doc.status !== 'completed'
                    ? `<span class="badge badge-${doc.status}">${doc.status}</span>`
                    : '';
                const progressBar = progress !== null
                    ? `<div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                       <span class="progress-text">${progress}%</span>`
                    : '';

                card.innerHTML = `
                    <div class="doc-info">
                        <h3 class="doc-title">${doc.title}</h3>
                        <span class="doc-meta">${doc.file_type.toUpperCase()} &middot; ${formatSize(doc.file_size)}</span>
                        ${statusBadge}
                        ${progressBar}
                    </div>
                    <div class="doc-actions">
                        ${doc.status === 'completed' ? `<button class="btn btn-primary btn-sm" onclick="openReader(${doc.id})">Read</button><button class="btn btn-secondary btn-sm" onclick="openEditor(${doc.id})">Edit</button>` : ''}
                        <button class="btn btn-danger btn-sm" onclick="deleteDoc(${doc.id})">Delete</button>
                    </div>
                `;
                docsList.appendChild(card);
            }
        } catch (err) {
            docsList.innerHTML = '<p class="error-msg">Failed to load documents.</p>';
        }
    }

    function formatSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1048576).toFixed(1) + ' MB';
    }

    function openReader(docId) {
        window.location.href = `/read/${docId}/`;
    }

    function openEditor(docId) {
        window.location.href = `/edit/${docId}/`;
    }

    async function deleteDoc(docId) {
        if (!confirm('Delete this document?')) return;
        try {
            await api.delete(`/api/documents/${docId}/`);
            loadDocuments();
        } catch (err) {
            alert('Failed to delete document.');
        }
    }

    // Upload handling
    document.getElementById('btn-upload').addEventListener('click', () => {
        document.getElementById('file-input').click();
    });

    document.getElementById('file-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        uploadStatus.hidden = false;
        uploadMsg.textContent = `Uploading ${file.name}...`;

        try {
            const formData = new FormData();
            formData.append('file', file);
            await api.upload('/api/documents/upload/', formData);
            uploadMsg.textContent = 'Upload complete! Processing...';
            setTimeout(() => {
                uploadStatus.hidden = true;
                loadDocuments();
            }, 2000);
        } catch (err) {
            uploadMsg.textContent = 'Upload failed: ' + (err.message || 'Unknown error');
        }
        e.target.value = '';
    });

    document.getElementById('btn-logout').addEventListener('click', () => {
        api.logout();
        window.location.href = '/';
    });

    let searchTimeout = null;
    searchInput.addEventListener('input', () => {
        clearTimeout(searchTimeout);
        searchTimeout = setTimeout(loadDocuments, 300);
    });
    sortSelect.addEventListener('change', loadDocuments);
    statusSelect.addEventListener('change', loadDocuments);

    loadDocuments();
    // Poll for processing documents
    setInterval(loadDocuments, 10000);
</script>
{% endblock %}
